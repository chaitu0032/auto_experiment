[project]
name = "autoexp"
version = "0.1.0"
description = "Master/worker RL experiment orchestration: observe, prune, decide, report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.2", "gymnasium>=0.29", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
autoexp = "autoexp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoexp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
